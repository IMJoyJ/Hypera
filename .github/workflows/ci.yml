name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify neutral repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '\.(hep|heb|sav)$|^TEMP/' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: Forbidden game archive or TEMP files tracked in git:"
            echo "$forbidden"
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux CJK fonts for typography tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fontconfig && fc-cache -f

      - name: Build Windows desktop hosts
        if: runner.os == 'Windows'
        run: |
          dotnet build src/Hypera.Views.WinForms/Hypera.Views.WinForms.csproj -c Release
          dotnet build src/Hypera.Views.Wpf/Hypera.Views.Wpf.csproj -c Release
          dotnet build src/Hypera.Standalone/Hypera.Standalone.csproj -c Release
          dotnet build src/Hypera.Packager/Hypera.Packager.csproj -c Release

      - name: Test Hypera.Tests
        run: dotnet test tests/Hypera.Tests/Hypera.Tests.csproj -c Release --verbosity normal

      - name: Test Hypera.Platform.Tests
        run: dotnet test tests/Hypera.Platform.Tests/Hypera.Platform.Tests.csproj -c Release --verbosity normal

      - name: Test Hypera.Packager.Tests
        if: runner.os == 'Windows'
        run: dotnet test tests/Hypera.Packager.Tests/Hypera.Packager.Tests.csproj -c Release --verbosity normal

      - name: Smoke check CLI version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(dotnet run --project src/Hypera.Cli/Hypera.Cli.csproj -c Release --no-build -- --version)
          echo "CLI version output: $ver"
          echo "$ver" | grep -Eq '^hypera [0-9]+\.[0-9]+\.[0-9]+'

  build-maui-windows:
    name: Build MAUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build Hypera.Maui (Windows)
        run: >-
          dotnet build src/Hypera.Maui/Hypera.Maui.csproj
          -p:MauiTargetFramework=net10.0-windows10.0.19041.0
          -f net10.0-windows10.0.19041.0
          -c Release

  build-maui-android:
    name: Build MAUI (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Microsoft OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >-
          dotnet build src/Hypera.Maui/Hypera.Maui.csproj
          -t:InstallAndroidDependencies
          -p:MauiTargetFramework=net10.0-android
          -f net10.0-android
          -p:AcceptAndroidSDKLicenses=True
          -p:AndroidSdkDirectory="${ANDROID_HOME:-$HOME/android-sdk}"

      - name: Build Hypera.Maui (Android)
        run: >-
          dotnet build src/Hypera.Maui/Hypera.Maui.csproj
          -p:MauiTargetFramework=net10.0-android
          -f net10.0-android
          -c Release
          -p:AndroidSdkDirectory="${ANDROID_HOME:-$HOME/android-sdk}"
