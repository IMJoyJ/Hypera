name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  prepare:
    name: Prepare release metadata & verify tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      semver: ${{ steps.meta.outputs.semver }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRE="true"
            else
              PRE="false"
            fi
          fi

          RAW="${TAG#v}"
          if [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SEMVER="${RAW}.0"
          else
            SEMVER="$RAW"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG semver=$SEMVER prerelease=$PRE"

      - name: Verify neutral repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '\.(hep|heb|sav)$|^TEMP/' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: Forbidden game archive or TEMP files tracked in git:"
            echo "$forbidden"
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run full Linux test suite
        run: |
          dotnet test tests/Hypera.Tests/Hypera.Tests.csproj -c Release
          dotnet test tests/Hypera.Platform.Tests/Hypera.Platform.Tests.csproj -c Release

  verify-windows:
    name: Verify Windows test suite
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run full Windows test suite
        run: |
          dotnet test tests/Hypera.Tests/Hypera.Tests.csproj -c Release
          dotnet test tests/Hypera.Platform.Tests/Hypera.Platform.Tests.csproj -c Release

  build-cli:
    name: Build CLI (${{ matrix.rid }})
    needs: [prepare, verify-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
            smoke: true
          - os: windows-latest
            rid: win-arm64
            ext: zip
            smoke: false
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz
            smoke: false
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz
            smoke: true
          - os: macos-latest
            rid: osx-x64
            ext: tar.gz
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Hypera.Cli
        run: >-
          dotnet publish src/Hypera.Cli/Hypera.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ needs.prepare.outputs.semver }}
          -o publish/cli

      - name: Smoke test CLI binary (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & .\publish\cli\hypera.exe --version
          Write-Output "CLI version: $out"
          if ($out -notmatch [regex]::Escape("${{ needs.prepare.outputs.semver }}")) {
            throw "Unexpected CLI version output: $out"
          }

      - name: Smoke test CLI binary (Unix)
        if: matrix.smoke && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x publish/cli/hypera
          out=$(./publish/cli/hypera --version)
          echo "CLI version: $out"
          echo "$out" | grep -F "${{ needs.prepare.outputs.semver }}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item LICENSE, README.md, README.ja.md -Destination publish/cli/
          Compress-Archive -Path publish/cli/* -DestinationPath "dist/hypera-cli-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.zip" -Force

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x publish/cli/hypera
          cp LICENSE README.md README.ja.md publish/cli/
          tar -czf "dist/hypera-cli-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.tar.gz" -C publish/cli .

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  build-standalone:
    name: Build Standalone (win-x64)
    needs: [prepare, verify-windows]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Hypera.Standalone
        run: >-
          dotnet publish src/Hypera.Standalone/Hypera.Standalone.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ needs.prepare.outputs.semver }}
          -o publish/standalone

      - name: Headless smoke test Standalone binary
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "standalone_smoke"
          New-Item -ItemType Directory -Path "$tmp\ERB" -Force | Out-Null
          Set-Content -Path "$tmp\ERB\Title.erb" -Value "@SYSTEM_TITLE`nPRINTL Hypera Standalone CI Smoke`nWAIT`nQUIT" -Encoding utf8
          $png = Join-Path $tmp "smoke.png"
          $outFile = Join-Path $tmp "stdout.txt"
          $errFile = Join-Path $tmp "stderr.txt"
          $p = Start-Process -FilePath (Resolve-Path "publish\standalone\Hypera.Standalone.exe") `
            -ArgumentList $tmp, "--headless-smoke", $png `
            -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          Get-Content $outFile
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png) -or (Get-Item $png).Length -lt 100) {
            Get-Content $errFile
            throw "Standalone smoke test failed with exit code $($p.ExitCode)"
          }

      - name: Package archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item LICENSE, README.md, README.ja.md -Destination publish/standalone/
          Compress-Archive -Path publish/standalone/* -DestinationPath "dist/hypera-standalone-${{ needs.prepare.outputs.tag }}-win-x64.zip" -Force

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-win-x64
          path: dist/*
          if-no-files-found: error

  build-server:
    name: Build Server (${{ matrix.rid }})
    needs: [prepare, verify-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Hypera.Server
        run: >-
          dotnet publish src/Hypera.Server/Hypera.Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ needs.prepare.outputs.semver }}
          -o publish/server

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item LICENSE, README.md, README.ja.md -Destination publish/server/
          Compress-Archive -Path publish/server/* -DestinationPath "dist/hypera-server-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.zip" -Force

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x publish/server/Hypera.Server
          cp LICENSE README.md README.ja.md publish/server/
          tar -czf "dist/hypera-server-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.tar.gz" -C publish/server .

      - name: Upload Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  build-maui-windows:
    name: Build MAUI (win-x64)
    needs: [prepare, verify-windows]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Publish Hypera.Maui (Windows Unpackaged)
        run: >-
          dotnet publish src/Hypera.Maui/Hypera.Maui.csproj
          -p:MauiTargetFramework=net10.0-windows10.0.19041.0
          -f net10.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ needs.prepare.outputs.semver }}
          -p:ApplicationDisplayVersion=${{ needs.prepare.outputs.semver }}
          -o publish/maui-win

      - name: Package archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item LICENSE, README.md, README.ja.md -Destination publish/maui-win/
          Compress-Archive -Path publish/maui-win/* -DestinationPath "dist/hypera-maui-${{ needs.prepare.outputs.tag }}-win-x64.zip" -Force

      - name: Upload MAUI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-win-x64
          path: dist/*
          if-no-files-found: error

  build-maui-android:
    name: Build MAUI (Android APK)
    needs: [prepare, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Microsoft OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >-
          dotnet build src/Hypera.Maui/Hypera.Maui.csproj
          -t:InstallAndroidDependencies
          -p:MauiTargetFramework=net10.0-android
          -f net10.0-android
          -p:AcceptAndroidSDKLicenses=True
          -p:AndroidSdkDirectory="${ANDROID_HOME:-$HOME/android-sdk}"

      - name: Publish Hypera.Maui (Android APK)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          EXTRA_ARGS=()
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            EXTRA_ARGS+=(
              "-p:AndroidKeyStore=true"
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$ANDROID_KEY_PASS"
              "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASS"
            )
          fi

          dotnet publish src/Hypera.Maui/Hypera.Maui.csproj \
            -p:MauiTargetFramework=net10.0-android \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkDirectory="$SDK_DIR" \
            -p:Version="${{ needs.prepare.outputs.semver }}" \
            -p:ApplicationDisplayVersion="${{ needs.prepare.outputs.semver }}" \
            "${EXTRA_ARGS[@]}" \
            -o publish/maui-android

          mkdir -p dist
          APK_SIGNED=$(find publish/maui-android -maxdepth 2 -name '*-Signed.apk' | head -n 1 || true)
          APK_ANY=$(find publish/maui-android -maxdepth 2 -name '*.apk' | head -n 1 || true)
          SRC_APK="${APK_SIGNED:-$APK_ANY}"
          if [ -z "$SRC_APK" ]; then
            echo "ERROR: No APK produced in publish/maui-android"
            ls -la publish/maui-android
            exit 1
          fi
          cp "$SRC_APK" "dist/hypera-maui-${{ needs.prepare.outputs.tag }}-android.apk"
          ls -lh dist/

      - name: Upload MAUI Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-android
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs:
      - prepare
      - build-cli
      - build-standalone
      - build-server
      - build-maui-windows
      - build-maui-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          cat <<'EOF' > release-notes.md
          ## Hypera ${{ needs.prepare.outputs.tag }}

          > **中立发布声明 / 中立配布に関する注意**
          > 本 Release 仅包含中立的 Hypera 静态编译器、打包工具、独立桌面/移动/终端执行器与 Web 托管服务端，**不包含任何第三方游戏脚本或游戏资源**。
          > 本リリースには中立なコンパイラ・パッケージャ・各種実行クライアントおよび Web ホストサーバーのみが含まれており、**特定のゲームスクリプトやゲームアセットは一切同梱されていません。**

          ### 发布产物 / 配布バイナリ一覧
          - **Standalone 桌面执行器 (Windows x64)**: `hypera-standalone-${{ needs.prepare.outputs.tag }}-win-x64.zip`（单文件自包含，支持直接加载 `.hep`/`.heb`/`.zip`/目录与 `HYPRBNDL` 封装）
          - **CLI 编译器与工具链**: `hypera-cli-${{ needs.prepare.outputs.tag }}-{win-x64,win-arm64,linux-x64,linux-arm64,osx-arm64,osx-x64}.{zip,tar.gz}`
          - **多用户 Web 托管服务端**: `hypera-server-${{ needs.prepare.outputs.tag }}-{win-x64,linux-x64,linux-arm64,osx-arm64}.{zip,tar.gz}`
          - **MAUI 跨平台客户端**: `hypera-maui-${{ needs.prepare.outputs.tag }}-win-x64.zip`、`hypera-maui-${{ needs.prepare.outputs.tag }}-android.apk`
          - **校验和 / チェックサム**: `SHA256SUMS.txt`

          ### 许可证 / ライセンス
          Copyright (c) 2026 JoyJ. All rights reserved. (See `LICENSE` in the repository.)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Hypera ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: release-assets/*
